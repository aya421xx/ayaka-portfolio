name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Render Illustrator catalog preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftoppm -f 1 -singlefile -r 150 -png "skyfolio/assets/catalog1.pdf" "skyfolio/assets/illustrator-catalog-preview"
      - name: Prepare optimized images for web
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          from PIL import Image, ImageOps
          import re

          root = Path('skyfolio')
          html_path = root / 'index.html'
          html = html_path.read_text(encoding='utf-8')
          optimized = {}
          pattern = re.compile(r'<img\b[^>]*>', re.I)

          def optimize(match):
              tag = match.group(0)
              src_match = re.search(r'\bsrc="([^"]+)"', tag)
              if not src_match:
                  return tag
              src = src_match.group(1)
              original = unquote(src.split('?', 1)[0])
              source = root / original
              if source.suffix.lower() not in ('.png', '.jpg', '.jpeg') or not source.is_file():
                  return tag
              if original not in optimized:
                  target = source.with_suffix('.webp')
                  try:
                      with Image.open(source) as opened:
                          im = ImageOps.exif_transpose(opened)
                          im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                          if im.mode not in ('RGB', 'RGBA'):
                              im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                          im.save(target, 'WEBP', quality=82, method=5)
                      optimized[original] = target.relative_to(root).as_posix()
                      print(f'{original}: {source.stat().st_size:,} -> {target.stat().st_size:,} bytes')
                  except Exception as exc:
                      print(f'Skipped {original}: {exc}')
                      optimized[original] = src
              result = tag.replace('src="' + src + '"', 'src="' + optimized[original] + '"')
              if 'loading=' not in result and original != 'assets/travel-hero-collage.png':
                  result = result.replace('<img ', '<img loading="lazy" decoding="async" ', 1)
              if original == 'assets/travel-hero-collage.png':
                  result = result.replace('<img ', '<img fetchpriority="high" decoding="async" ', 1)
              return result

          html = pattern.sub(optimize, html)
          # Create optimized full-resolution versions for the enlarged image links.
          for original in ('assets/107-2.png', 'assets/007-1.png'):
              source = root / original
              if not source.is_file():
                  continue
              target = source.with_name(source.stem + '-full.webp')
              with Image.open(source) as opened:
                  im = ImageOps.exif_transpose(opened)
                  im.thumbnail((2200, 2200), Image.Resampling.LANCZOS)
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.save(target, 'WEBP', quality=85, method=5)
              html = html.replace('href="' + original + '"', 'href="assets/' + target.name + '"')
              print(f'Full-size {original}: {source.stat().st_size:,} -> {target.stat().st_size:,} bytes')
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio files
        uses: actions/upload-pages-artifact@v3
        with:
          path: skyfolio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
