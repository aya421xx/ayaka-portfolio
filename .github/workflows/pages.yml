name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Render Illustrator catalog preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftoppm -f 1 -singlefile -r 150 -png "skyfolio/assets/カタログ.pdf" "skyfolio/assets/illustrator-catalog-preview"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio files
        uses: actions/upload-pages-artifact@v3
        with:
          path: skyfolio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
